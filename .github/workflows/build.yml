name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        run: |
          set +e
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then exit 0; fi
            if ! grep -qiE "Could not resolve|Could not GET|Could not HEAD|timed out|Connection reset|Connection refused|Received status code 5" build.log; then break; fi
            echo "Network problem, retrying in 15s..."
            sleep 15
          done
          {
            echo "## Build failed - main errors"
            echo '```'
            grep -E -A4 "error:|What went wrong|Execution failed|Could not|Caused by" build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          first=$(grep -m1 -E -A1 "error:|What went wrong" build.log | tr '\n' ' ' | cut -c1-300)
          echo "::error::${first}"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DynamicPill-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
